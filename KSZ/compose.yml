# 小智服务端全模块部署 - Showroom 复用现有镜像（Host 网络模式）
# 在本目录执行：docker compose up -d --no-build --pull never

name: xiaozhi-esp32-server_showroom

services:
  xiaozhi-mqtt-gateway:
    profiles: [mqtt]
    image: xiaozhi-esp32-server:mqtt_local
    pull_policy: never
    restart: always
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${MQTT_PORT:-31883}:${MQTT_PORT:-31883}/tcp"
      - "${MQTT_UDP_PORT:-38884}:${MQTT_UDP_PORT:-38884}/udp"
      - "127.0.0.1:${MQTT_API_PORT:-38007}:${MQTT_API_PORT:-38007}/tcp"
    environment:
      TZ: Asia/Shanghai
      PUBLIC_IP: ${MQTT_PUBLIC_HOST:-}
      MQTT_PORT: ${MQTT_PORT:-31883}
      UDP_PORT: ${MQTT_UDP_PORT:-38884}
      API_PORT: ${MQTT_API_PORT:-38007}
      MQTT_SIGNATURE_KEY: ${MQTT_SIGNATURE_KEY:-}
      SERVER_SECRET: ${MQTT_SERVER_SECRET:-}
      MQTT_CHAT_SERVER: ${MQTT_CHAT_SERVER:-ws://host.docker.internal:38000/xiaozhi/v1/?from=mqtt_gateway}
      KSZ_GUIDE_CONTROL_URL: ${KSZ_GUIDE_CONTROL_URL:-}
      KSZ_GUIDE_CONTROL_TOKEN: ${KSZ_GUIDE_CONTROL_TOKEN:-}

  xiaozhi-esp32-server:
    image: xiaozhi-esp32-server:server_local
    pull_policy: never
    container_name: xiaozhi-esp32-server_showroom
    depends_on:
      xiaozhi-esp32-server-db:
        condition: service_healthy
      xiaozhi-esp32-server-redis:
        condition: service_healthy
    restart: always
    network_mode: host
    security_opt:
      - seccomp:unconfined
    environment:
      - TZ=Asia/Shanghai
      - KSZ_IDLE_GREETING_MIN_INTERVAL_MS=${KSZ_IDLE_GREETING_MIN_INTERVAL_MS:-120000}
      - KSZ_NARRATION_MAX_TOKENS=${KSZ_NARRATION_MAX_TOKENS:-4096}
      - KSZ_VISION_CONTEXT_ENABLED=${KSZ_VISION_CONTEXT_ENABLED:-1}
      - KSZ_VISION_CONTEXT_TTL_SECONDS=${KSZ_VISION_CONTEXT_TTL_SECONDS:-180}
      - KSZ_GUIDE_ENABLED=${KSZ_GUIDE_ENABLED:-0}
      - KSZ_GUIDE_PRESENCE_ENABLED=${KSZ_GUIDE_PRESENCE_ENABLED:-0}
      - KSZ_GUIDE_AUTO_ANNOUNCE_ENABLED=${KSZ_GUIDE_AUTO_ANNOUNCE_ENABLED:-1}
      - KSZ_GUIDE_ANNOUNCE_ON_FIRST_BEACON=${KSZ_GUIDE_ANNOUNCE_ON_FIRST_BEACON:-1}
      - KSZ_GUIDE_INTERRUPT_ON_BEACON_CHANGE=${KSZ_GUIDE_INTERRUPT_ON_BEACON_CHANGE:-1}
      - KSZ_GUIDE_MIN_ANNOUNCE_INTERVAL_MS=${KSZ_GUIDE_MIN_ANNOUNCE_INTERVAL_MS:-15000}
      - KSZ_GUIDE_SAME_BEACON_COOLDOWN_MS=${KSZ_GUIDE_SAME_BEACON_COOLDOWN_MS:-60000}
      - KSZ_GUIDE_POSITION_TTL_MS=${KSZ_GUIDE_POSITION_TTL_MS:-15000}
      - KSZ_GUIDE_PENDING_TTL_MS=${KSZ_GUIDE_PENDING_TTL_MS:-15000}
      - KSZ_GUIDE_USER_QUIET_MS=${KSZ_GUIDE_USER_QUIET_MS:-15000}
      - KSZ_MANAGEMENT_API_URL=${KSZ_MANAGEMENT_API_URL:-http://127.0.0.1:14000/api/v1/integration}
      - KSZ_MANAGEMENT_API_TOKEN=${KSZ_MANAGEMENT_API_TOKEN:-}
      - KSZ_GUIDE_CONTROL_TOKEN=${KSZ_GUIDE_CONTROL_TOKEN:-}
    volumes:
      - ${DATA_DIR:-./data}:/opt/xiaozhi-esp32-server/data
      # 使用远程 ASR，故不挂载本地 SenseVoice 模型。
      # 启用本地 FunASR 时，再恢复 model.pt 文件挂载。

  xiaozhi-esp32-server-web:
    image: xiaozhi-esp32-server:web_local
    pull_policy: never
    container_name: xiaozhi-esp32-server_showroom-web
    command: ["bash", "/start.sh"]
    restart: always
    network_mode: host
    depends_on:
      xiaozhi-esp32-server-db:
        condition: service_healthy
      xiaozhi-esp32-server-redis:
        condition: service_healthy
    environment:
      - TZ=Asia/Shanghai
      - SPRING_DATASOURCE_DRUID_URL=jdbc:mysql://127.0.0.1:${MYSQL_PORT:-33307}/xiaozhi_esp32_server?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true&connectTimeout=30000&socketTimeout=30000&autoReconnect=true&failOverReadOnly=false&maxReconnects=10${SPRING_DATASOURCE_DRUID_EXTRA_ARGS:+&$SPRING_DATASOURCE_DRUID_EXTRA_ARGS}
      - SPRING_DATASOURCE_DRUID_USERNAME=root
      - SPRING_DATASOURCE_DRUID_PASSWORD=${SPRING_DATASOURCE_DRUID_PASSWORD:-123456}
      - SPRING_DATA_REDIS_HOST=127.0.0.1
      - SPRING_DATA_REDIS_PASSWORD=
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT:-36380}
      - KSZ_CELL_LOCATION_ENABLED=${KSZ_CELL_LOCATION_ENABLED:-0}
      - KSZ_TANSHU_API_KEY=${KSZ_TANSHU_API_KEY:-}
      - KSZ_CELL_LOCATION_CACHE_SECONDS=${KSZ_CELL_LOCATION_CACHE_SECONDS:-2592000}
      - KSZ_CELL_LOCATION_RETRY_SECONDS=${KSZ_CELL_LOCATION_RETRY_SECONDS:-60}
      - KSZ_CELL_REPORT_MAX_AGE_SECONDS=${KSZ_CELL_REPORT_MAX_AGE_SECONDS:-86400}
      - KSZ_LOCATION_DEFAULT_CITY=${KSZ_LOCATION_DEFAULT_CITY:-}
    volumes:
      - ${UPLOAD_DIR:-./uploadfile}:/uploadfile
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./start-web.sh:/start.sh:ro

  xiaozhi-esp32-server-db:
    image: mysql:latest
    pull_policy: never
    container_name: xiaozhi-esp32-server_showroom-db
    command: --port=${MYSQL_PORT:-33307}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "${MYSQL_PORT:-33307}"]
      timeout: 45s
      interval: 10s
      retries: 10
    restart: always
    network_mode: host
    volumes:
      - ${MYSQL_DATA_DIR:-./mysql/data}:/var/lib/mysql
      - ./mysql/initdb/00-snapshot.sql:/docker-entrypoint-initdb.d/00-snapshot.sql:ro
      - ./mysql-init/99-showroom-ports.sql:/docker-entrypoint-initdb.d/99-showroom-ports.sql:ro
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-123456}
      - MYSQL_DATABASE=xiaozhi_esp32_server
      - MYSQL_INITDB_ARGS=--character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  xiaozhi-esp32-server-redis:
    image: redis:8.0
    pull_policy: never
    container_name: xiaozhi-esp32-server_showroom-redis
    command: ["redis-server", "--port", "${REDIS_PORT:-36380}"]
    restart: always
    network_mode: host
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT:-36380}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
