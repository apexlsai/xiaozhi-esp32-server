# 小智服务端全模块部署 - KSZ 二次开发本地构建版（Host 网络模式）
# 在本目录执行：docker compose up -d --build

services:
  xiaozhi-mqtt-gateway:
    profiles: [mqtt]
    image: xiaozhi-esp32-server:mqtt_local
    build:
      context: ./mqtt
    restart: always
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${MQTT_PORT:-1883}:${MQTT_PORT:-1883}/tcp"
      - "${MQTT_UDP_PORT:-8884}:${MQTT_UDP_PORT:-8884}/udp"
      - "127.0.0.1:${MQTT_API_PORT:-8007}:8007/tcp"
    environment:
      TZ: Asia/Shanghai
      PUBLIC_IP: ${MQTT_PUBLIC_HOST:-}
      MQTT_PORT: ${MQTT_PORT:-1883}
      UDP_PORT: ${MQTT_UDP_PORT:-8884}
      API_PORT: 8007
      MQTT_SIGNATURE_KEY: ${MQTT_SIGNATURE_KEY:-}
      SERVER_SECRET: ${MQTT_SERVER_SECRET:-}
      MQTT_CHAT_SERVER: ${MQTT_CHAT_SERVER:-ws://host.docker.internal:8000/xiaozhi/v1/?from=mqtt_gateway}
      KSZ_GUIDE_CONTROL_URL: ${KSZ_GUIDE_CONTROL_URL:-}
      KSZ_GUIDE_CONTROL_TOKEN: ${KSZ_GUIDE_CONTROL_TOKEN:-}

  xiaozhi-esp32-server:
    image: xiaozhi-esp32-server:server_local
    build:
      context: ..
      dockerfile: KSZ/Dockerfile-server
    container_name: xiaozhi-esp32-server
    depends_on:
      xiaozhi-esp32-server-db:
        condition: service_healthy
      xiaozhi-esp32-server-redis:
        condition: service_healthy
    restart: always
    network_mode: host
    security_opt:
      - seccomp:unconfined
    environment:
      - TZ=Asia/Shanghai
      - KSZ_GUIDE_ENABLED=${KSZ_GUIDE_ENABLED:-0}
      - KSZ_MANAGEMENT_API_URL=${KSZ_MANAGEMENT_API_URL:-http://127.0.0.1:14000/api/v1/integration}
      - KSZ_MANAGEMENT_API_TOKEN=${KSZ_MANAGEMENT_API_TOKEN:-}
      - KSZ_GUIDE_CONTROL_TOKEN=${KSZ_GUIDE_CONTROL_TOKEN:-}
    volumes:
      - ${DATA_DIR:-./data}:/opt/xiaozhi-esp32-server/data
      # 使用远程 OpenAI 兼容 ASR，故不挂载本地 SenseVoice 模型。
      # 启用本地 FunASR 时，再恢复 model.pt 文件挂载。

  xiaozhi-esp32-server-web:
    image: xiaozhi-esp32-server:web_local
    build:
      context: ..
      dockerfile: Dockerfile-web
    container_name: xiaozhi-esp32-server-web
    restart: always
    network_mode: host
    depends_on:
      xiaozhi-esp32-server-db:
        condition: service_healthy
      xiaozhi-esp32-server-redis:
        condition: service_healthy
    environment:
      - TZ=Asia/Shanghai
      - SPRING_DATASOURCE_DRUID_URL=jdbc:mysql://127.0.0.1:${MYSQL_PORT:-3307}/xiaozhi_esp32_server?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true&connectTimeout=30000&socketTimeout=30000&autoReconnect=true&failOverReadOnly=false&maxReconnects=10${SPRING_DATASOURCE_DRUID_EXTRA_ARGS:+&$SPRING_DATASOURCE_DRUID_EXTRA_ARGS}
      - SPRING_DATASOURCE_DRUID_USERNAME=root
      - SPRING_DATASOURCE_DRUID_PASSWORD=${SPRING_DATASOURCE_DRUID_PASSWORD:-123456}
      - SPRING_DATA_REDIS_HOST=127.0.0.1
      - SPRING_DATA_REDIS_PASSWORD=
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT:-6379}
    volumes:
      - ${UPLOAD_DIR:-./uploadfile}:/uploadfile

  xiaozhi-esp32-server-db:
    image: mysql:latest
    container_name: xiaozhi-esp32-server-db
    command: --port=${MYSQL_PORT:-3307}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "${MYSQL_PORT:-3307}"]
      timeout: 45s
      interval: 10s
      retries: 10
    restart: always
    network_mode: host
    volumes:
      - ${MYSQL_DATA_DIR:-./mysql/data}:/var/lib/mysql
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-123456}
      - MYSQL_DATABASE=xiaozhi_esp32_server
      - MYSQL_INITDB_ARGS=--character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  xiaozhi-esp32-server-redis:
    image: redis:8.0
    container_name: xiaozhi-esp32-server-redis
    command: ["redis-server", "--port", "${REDIS_PORT:-6379}"]
    restart: always
    network_mode: host
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT:-6379}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
